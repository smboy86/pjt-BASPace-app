```

## 협업

- product-planner에게 검증된 사용자 문제와 운영 요구사항을 전달한다.
- spec-planner에게 상태·역할·예외 흐름에 필요한 task 후보를 전달한다.
- design-architect에게 고객 요청 폼, 관리자 배정 화면, 견적 타임라인의 참고 패턴을 전달한다.
- 새 기능 제안이 PRD 범위를 바꾸면 바로 구현하지 않고 사용자 결정을 요청한다.
"""
