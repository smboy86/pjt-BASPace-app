# BASpace pipeline specification

project:
  name: ""
  category: ""
  context: ""
  target_users: []
  success_criteria: []
  non_goals: []

execution:
  unattended: false
  on_ambiguity: ask

measurement:
  firebase_analytics: false
  crashlytics: false
  remote_config: false
  north_star: ""

ux:
  onboarding: none
  store_review: false
  languages: [ko]
  dark_mode: light_only
  haptics: false
  empty_state_illustration: basic

auth:
  methods: []
  account_deletion: in_app
  profile_screen: true
  biometric_gate: none

backend:
  type: none
  offline_first: false
  uploads: false
  realtime: false
  search: ""

permissions:
  media: none
  location: none
  push: none
  advanced: []
  background: none

policy:
  ugc: false
  age_rating: "4+"
  children_under_13: false
  privacy_url: ""

deployment:
  platforms: [ios, android]
  beta_channel: internal-testing
  aso: project-authored

tech:
  animation_level: minimal
  charts: false
  custom_camera: false
