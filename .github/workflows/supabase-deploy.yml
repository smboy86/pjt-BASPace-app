name: Supabase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-deploy.yml
      - supabase/config.toml
      - supabase/migrations/**

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kfvfamzyyjsktnbuvqnh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Validate required credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Reject placeholder database types
        shell: bash
        run: |
          if grep -q 'Record<string, never>' src/shared/supabase/database.types.ts; then
            echo "::error::Commit generated Supabase database types before deployment."
            exit 1
          fi

      - name: Run static verification
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Link Supabase project
        run: npx --yes supabase@2.109.1 link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview migrations
        run: npx --yes supabase@2.109.1 db push --linked --dry-run

      - name: Apply migrations
        run: npx --yes supabase@2.109.1 db push --linked

      - name: Push Auth and project configuration
        run: npx --yes supabase@2.109.1 config push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Generate database types
        shell: bash
        run: |
          npx --yes supabase@2.109.1 gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" \
            --schema public \
            > /tmp/database.types.ts
          npx prettier --config .prettierrc.js --write /tmp/database.types.ts

      - name: Verify committed database types
        shell: bash
        run: |
          if ! diff -u src/shared/supabase/database.types.ts /tmp/database.types.ts; then
            echo "::error::Committed database types do not match the remote schema."
            exit 1
          fi
